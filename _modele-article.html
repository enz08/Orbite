<!DOCTYPE html>
<!--
  =====================  MODÈLE D'ARTICLE ORBITE  =====================
  1. Dépose l'image dans  assets/articles/00XX.jpg  (même numéro que l'article).
  2. Ajoute l'entrée EN HAUT de data-articles.js (id, date, categorie, titre,
     extrait, image: "/assets/articles/00XX.jpg"). C'est LA source unique :
     la catégorie, le titre, la date et l'image de la page s'y remplissent
     automatiquement grâce à  <body data-id="00XX">.
  3. Copie ce fichier en  articles/00XX.html  et remplace les {{...}} du <head>
     (Ctrl+H → cherche "{{") : ils servent uniquement au référencement Google
     et aux aperçus sur les réseaux (les robots ne lisent pas le JavaScript).
  4. Écris le texte dans <div class="body">.
  5. Ajoute l'URL dans sitemap.xml.
  Ce fichier commence par "_" : GitHub Pages (Jekyll) ne le publie pas.
  ===================================================================
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITRE}} — Orbite</title>
<meta name="description" content="{{EXTRAIT : 1 à 2 phrases, 150 caractères environ, sans balise HTML}}">
<meta name="robots" content="index, follow">
<meta name="author" content="Orbite">
<link rel="canonical" href="https://www.orbite.kdns.fr/articles/{{ID}}">

<!-- Open Graph / réseaux sociaux -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="Orbite">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://www.orbite.kdns.fr/articles/{{ID}}">
<meta property="og:title" content="{{TITRE}} — Orbite">
<meta property="og:description" content="{{EXTRAIT}}">
<meta property="og:image" content="https://www.orbite.kdns.fr/assets/articles/{{ID}}.jpg">
<meta property="og:image:alt" content="{{TITRE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITRE}} — Orbite">
<meta name="twitter:description" content="{{EXTRAIT}}">
<meta name="twitter:image" content="https://www.orbite.kdns.fr/assets/articles/{{ID}}.jpg">

<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
<meta name="theme-color" content="#0b0e17">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta property="article:published_time" content="{{DATE_ISO}}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{TITRE}}",
  "datePublished": "{{DATE_ISO}}",
  "image": "https://www.orbite.kdns.fr/assets/articles/{{ID}}.jpg",
  "inLanguage": "fr-FR",
  "author": { "@type": "Organization", "name": "Orbite" },
  "publisher": { "@type": "Organization", "name": "Orbite" },
  "mainEntityOfPage": "https://www.orbite.kdns.fr/articles/{{ID}}"
}
</script>
<link rel="stylesheet" href="/orbite.css">
<script src="/maintenance.js"></script>
</head>
<body data-page="article" data-id="{{ID}}">
<div id="site-header"></div>

<main id="main">
  <section class="section" id="articles">
    <div class="wrap">
      <article class="article-detail" id="article-detail">
        <a class="back-btn" href="/articles/">&larr; Retour aux articles</a>

        <!-- Rempli automatiquement depuis data-articles.js (via data-id) -->
        <span class="cat"></span>
        <h1></h1>
        <div class="meta"><time></time></div>
        <img class="hero-image" alt="">

        <div class="body">
          <h3>{{PREMIER SOUS-TITRE}}</h3>
          <p>{{Premier paragraphe.}}</p>

          <h3>{{DEUXIÈME SOUS-TITRE}}</h3>
          <p>Un paragraphe avec du <strong>gras</strong> ou de l'<em>italique</em>.</p>
          <ul>
            <li>Un point de liste</li>
          </ul>
        </div>

        <div class="article-avis">
          <p class="avis-question">Qu'avez-vous pensé de cet article ?</p>
          <div class="avis-buttons">
            <button type="button" class="avis-btn" data-vote="up" aria-label="J'ai aimé cet article">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3v11zM7 11l4.5-8a1.5 1.5 0 0 1 2.7.9v5.1h5.4a2 2 0 0 1 2 2.3l-1.3 8a2 2 0 0 1-2 1.7H7"/></svg>
            </button>
            <button type="button" class="avis-btn" data-vote="down" aria-label="Je n'ai pas aimé cet article">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(180deg);"><path d="M7 22H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3v11zM7 11l4.5-8a1.5 1.5 0 0 1 2.7.9v5.1h5.4a2 2 0 0 1 2 2.3l-1.3 8a2 2 0 0 1-2 1.7H7"/></svg>
            </button>
          </div>
          <p class="avis-merci hidden">Merci pour votre avis ! Ça nous aide beaucoup !</p>
        </div>
      </article>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<div id="site-chat"></div>

<script src="/data-events.js"></script>
<script src="/data-actus.js"></script>
<script src="/data-articles.js"></script>
<script src="/site.js"></script>
<script src="/page-article.js"></script>
</body>
</html>
