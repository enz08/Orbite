            <button type="submit" class="sujet-btn" id="sujet-btn">Proposer ce sujet</button>
            <span class="sujet-count" id="sujet-count">0 / 300</span>
          </div>
          <p class="sujet-msg hidden" id="sujet-msg" role="status"></p>
        </form>
      </div>
